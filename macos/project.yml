name: RapidLog
options:
  bundleIdPrefix: com.limky
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  RapidLog:
    type: application
    platform: macOS
    # The app loads the deployed web app over the network, so it bundles no web
    # assets. A RapidLog/public folder used to be declared here and was never
    # actually built into the product — it only carried stale copies of old
    # bundles that could never be served.
    sources:
      - path: RapidLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limky.rapidlog
        CODE_SIGN_ENTITLEMENTS: RapidLog/RapidLog.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "Rapid Log"
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
