name: RapidLog
options:
  bundleIdPrefix: com.limky
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  RapidLog:
    type: application
    platform: macOS
    sources:
      - path: RapidLog/RapidLogApp.swift
      - path: RapidLog/ContentView.swift
    resources:
      - path: RapidLog/public
        type: folder
        buildPhase: resources
      - path: RapidLog/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limky.rapidlog
        CODE_SIGN_ENTITLEMENTS: RapidLog/RapidLog.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "Rapid Log"
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
