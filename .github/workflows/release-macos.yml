name: Release macOS app

# Pushing a v* tag is what cuts a release, so the tag is the only place a
# version number lives. Nothing in the repo needs editing to ship, which is
# what stops MARKETING_VERSION drifting away from package.json again.
#
# workflow_dispatch is the rehearsal path: it builds and verifies exactly the
# same way but publishes nothing, so you can prove the pipeline works before
# any tag exists.
#
# The build itself lives in scripts/package-macos.sh rather than here, so the
# recipe has one home and can be run and debugged locally. Everything this
# workflow adds is the trigger and the publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.2.0)'
        required: true
        default: '0.0.0-test'

permissions:
  contents: write # create the Release and attach files to it

jobs:
  build:
    # macos-latest rather than a pinned image, so this cannot fail the day an
    # image is retired. If you want byte-reproducible builds, pin it to a
    # specific runner (macos-15, macos-26, ...) once you know which images your
    # account offers — the build uses no version-specific Xcode behaviour.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION='${{ inputs.version }}'
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine a version to build."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (build ${{ github.run_number }})"

      # Builds and packages the disk image, and refuses to produce it unless the
      # app reports the right version, lipo reports both architectures, the
      # signature survives the round trip through the image, the image has a
      # working Applications symlink, and no web asset ended up in the bundle.
      #
      # CFBundleVersion comes from the run number: it must increase for every
      # build macOS ever sees and must never repeat, which run_number gives
      # without any bookkeeping.
      - name: Build, package and verify
        run: ./scripts/package-macos.sh '${{ steps.meta.outputs.version }}' '${{ github.run_number }}'

      # Rehearsal path: keeps the artifacts for 14 days so you can download and
      # try them, without creating a Release or moving anything users can see.
      - name: Keep the artifacts (rehearsal only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rapidlog-macos-${{ steps.meta.outputs.version }}
          path: macos/build/artifacts/RapidLog-macOS.dmg
          retention-days: 14

      # The disk image is the only artifact. A zip left a bare app in Downloads
      # with no hint where it belonged, so it is no longer built or published.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.meta.outputs.version }}'
          # gh is preinstalled on the runner, so this needs no third-party
          # action and nothing extra to trust.
          gh release create "$GITHUB_REF_NAME" \
            macos/build/artifacts/RapidLog-macOS.dmg \
            --title "Rapid Log $VERSION" \
            --generate-notes

          echo "Published $GITHUB_REF_NAME with the disk image attached."
